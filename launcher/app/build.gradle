plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 34
        // Each family experiment gets a higher code while retaining the applicationId and signer,
        // so it upgrades in place without removing app data.
        versionCode 28
        versionName '2.9.2-family-experimental'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        resources {
            // Kotlin compiler/reflection metadata is carried by AndroidX's Kotlin stdlib, but this
            // launcher is Java-only and has no kotlin-reflect runtime dependency.
            excludes += [
                    'kotlin/annotation/annotation.kotlin_builtins',
                    'kotlin/collections/collections.kotlin_builtins',
                    'kotlin/coroutines/coroutines.kotlin_builtins',
                    'kotlin/internal/internal.kotlin_builtins',
                    'kotlin/kotlin.kotlin_builtins',
                    'kotlin/ranges/ranges.kotlin_builtins',
                    'kotlin/reflect/reflect.kotlin_builtins'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    // Device-only UI tests; excluded from both debug and release launcher APKs.
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
